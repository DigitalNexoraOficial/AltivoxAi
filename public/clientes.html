<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes | AltivoxAI</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>
</head>
<body class="admin-body">
  <div class="admin-grain" aria-hidden="true"></div>
  <aside class="sidebar" id="admin-sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>CRM · Clientes</h1>
        <p class="sub">Cartera, planes, valor mensual y seguimiento comercial.</p>
      </div>
      <div class="top-actions">
        <div class="pill"><span class="dot"></span><span id="admin-email">Admin</span></div>
        <button class="btn btn-primary" id="btn-new" type="button">+ Nuevo cliente</button>
        <button class="btn btn-soft" id="btn-export" type="button">Export CSV</button>
        <button class="btn btn-ghost" id="btn-refresh" type="button">Actualizar</button>
        <button class="btn btn-danger" id="btn-logout" type="button">Salir</button>
      </div>
    </header>

    <div id="setup-alert" class="alert" style="display:none"></div>

    <section class="kpis" id="kpis">
      <div class="kpi active" data-f="all"><div class="label">Total</div><div class="value" id="k-total">0</div><div class="hint">Cartera</div></div>
      <div class="kpi done" data-f="activo"><div class="label">Activos</div><div class="value" id="k-activos">0</div><div class="hint">En curso</div></div>
      <div class="kpi chat" data-f="vip"><div class="label">VIP / Pro</div><div class="value" id="k-vip">0</div><div class="hint">Planes altos</div></div>
      <div class="kpi pending" data-f="pausado"><div class="label">Pausados</div><div class="value" id="k-pausados">0</div><div class="hint">Riesgo</div></div>
      <div class="kpi" data-f="mrr"><div class="label">MRR €</div><div class="value" id="k-mrr">0</div><div class="hint">Valor mensual</div></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Buscar nombre, empresa, email, sector...">
      <select id="f-estado">
        <option value="">Estado</option>
        <option>activo</option>
        <option>pausado</option>
        <option>churn</option>
        <option>prospecto</option>
      </select>
      <select id="f-plan">
        <option value="">Plan</option>
        <option>starter</option>
        <option>growth</option>
        <option>pro</option>
        <option>vip</option>
      </select>
      <select id="sort">
        <option value="recent">Recientes</option>
        <option value="mrr">Mayor MRR</option>
        <option value="name">Nombre</option>
      </select>
      <span id="status-msg">Cargando...</span>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="panel-head"><h2>Cartera</h2><span id="count">0</span></div>
        <div class="list" id="list"><div class="empty">Cargando...</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Ficha</h2><span id="detail-title">Selecciona o crea</span></div>
        <div class="detail" id="detail"><div class="empty">Selecciona un cliente o pulsa “Nuevo cliente”.</div></div>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/admin-core.js"></script>
<script src="assets/js/n8n-bridge.js"></script>
<script>
(function () {
  var esc = AltivoxAdmin.esc;
  var money = AltivoxAdmin.money;
  var fmtDate = AltivoxAdmin.fmtDate;
  var waLink = AltivoxAdmin.waLink;
  var downloadCsv = AltivoxAdmin.downloadCsv;
  var sb = AltivoxAdmin.createClient();

  AltivoxAdmin.renderShell("clientes");

  var all = [];
  var selected = null;
  var quick = "all";
  var editing = null;
  var tableOk = true;

  function setStatus(m, err) {
    var el = document.getElementById("status-msg");
    el.textContent = m;
    el.style.color = err ? "#fda4af" : "#93c5fd";
  }

  async function load() {
    var r = await sb.from("clientes").select("*").order("created_at", { ascending: false });
    if (r.error) {
      tableOk = false;
      document.getElementById("setup-alert").style.display = "block";
      document.getElementById("setup-alert").innerHTML =
        'Falta la tabla <b>clientes</b> en Supabase. Abre SQL Editor y ejecuta el archivo <code>supabase/sql/clientes.sql</code> del repo. Error: ' +
        esc(r.error.message);
      setStatus("Tabla clientes no disponible", true);
      all = [];
      render();
      return;
    }
    tableOk = true;
    document.getElementById("setup-alert").style.display = "none";
    all = r.data || [];
    setStatus("CRM listo · " + all.length + " clientes");
    render();
  }

  function filtered() {
    var q = (document.getElementById("search").value || "").toLowerCase();
    var est = document.getElementById("f-estado").value;
    var plan = document.getElementById("f-plan").value;
    var sort = document.getElementById("sort").value;
    var rows = all.filter(function (c) {
      var e = (c.estado || "").toLowerCase();
      var p = (c.plan || "").toLowerCase();
      if (quick === "activo" && e !== "activo") return false;
      if (quick === "pausado" && e !== "pausado") return false;
      if (quick === "vip" && !(p === "vip" || p === "pro")) return false;
      if (est && e !== est) return false;
      if (plan && p !== plan) return false;
      if (q) {
        var blob = [c.nombre, c.empresa, c.email, c.telefono, c.sector, c.notas, c.plan, c.estado, c.lead_id].join(" ").toLowerCase();
        if (blob.indexOf(q) < 0) return false;
      }
      return true;
    });
    rows.sort(function (a, b) {
      if (sort === "mrr") return Number(b.valor_mensual || 0) - Number(a.valor_mensual || 0);
      if (sort === "name") return String(a.nombre || "").localeCompare(String(b.nombre || ""), "es");
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    });
    return rows;
  }

  function kpis() {
    document.getElementById("k-total").textContent = all.length;
    document.getElementById("k-activos").textContent = all.filter(function (c) { return (c.estado || "").toLowerCase() === "activo"; }).length;
    document.getElementById("k-vip").textContent = all.filter(function (c) {
      var p = (c.plan || "").toLowerCase();
      return p === "vip" || p === "pro";
    }).length;
    document.getElementById("k-pausados").textContent = all.filter(function (c) { return (c.estado || "").toLowerCase() === "pausado"; }).length;
    var mrr = all.reduce(function (s, c) { return s + Number(c.valor_mensual || 0); }, 0);
    document.getElementById("k-mrr").textContent = money(mrr);
  }

  function render() {
    kpis();
    var rows = filtered();
    document.getElementById("count").textContent = rows.length + " visibles";
    var list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = '<div class="empty">Sin clientes con estos filtros.</div>';
    } else {
      list.innerHTML = rows.map(function (c) {
        var active = selected && String(selected) === String(c.id) ? " active" : "";
        return (
          '<article class="row-item' + active + '" data-id="' + esc(c.id) + '">' +
            '<div>' +
              '<div class="title-row">' +
                '<strong>' + esc(c.nombre || "—") + '</strong>' +
                '<span class="badge ' + esc((c.estado || "").toLowerCase()) + '">' + esc(c.estado || "—") + '</span>' +
                '<span class="badge vip">' + esc(c.plan || "—") + '</span>' +
              '</div>' +
              '<div class="meta">' + esc(c.empresa || "Sin empresa") + " · " + esc(c.email || "sin email") + '</div>' +
              '<div class="preview">' + esc(c.sector || "Sin sector") + " · MRR " + money(c.valor_mensual) + " €</div>" +
            '</div>' +
            '<div class="meta">' + esc(fmtDate(c.updated_at || c.created_at)) + '</div>' +
          '</article>'
        );
      }).join("");
      Array.prototype.forEach.call(list.querySelectorAll(".row-item"), function (el) {
        el.onclick = function () {
          selected = el.getAttribute("data-id");
          editing = null;
          render();
          showDetail();
        };
      });
    }
    if (editing === "new") showForm(null);
    else if (selected) showDetail();
  }

  function getSel() {
    return all.find(function (c) { return String(c.id) === String(selected); }) || null;
  }

  function showDetail() {
    var c = getSel();
    if (!c) {
      document.getElementById("detail").innerHTML = '<div class="empty">Selecciona un cliente.</div>';
      return;
    }
    document.getElementById("detail-title").textContent = c.nombre || "Cliente";
    var wa = waLink(c.telefono, "Hola " + (c.nombre || "") + ", te escribimos desde AltivoxAi.");
    document.getElementById("detail").innerHTML =
      '<div class="grid">' +
        '<div class="field"><label>Empresa</label><div class="val">' + esc(c.empresa || "—") + '</div></div>' +
        '<div class="field"><label>Email</label><div class="val">' +
          (c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : "—") +
        '</div></div>' +
        '<div class="field"><label>Teléfono</label><div class="val">' + esc(c.telefono || "—") + '</div></div>' +
        '<div class="field"><label>Sector</label><div class="val">' + esc(c.sector || "—") + '</div></div>' +
        '<div class="field"><label>Estado / Plan</label><div class="val">' + esc(c.estado) + " / " + esc(c.plan) + '</div></div>' +
        '<div class="field"><label>MRR</label><div class="val">' + money(c.valor_mensual) + " €</div></div>" +
        '<div class="field full"><label>Notas</label><div class="val">' + esc(c.notas || "—") + '</div></div>' +
        '<div class="field"><label>Origen</label><div class="val">' + esc(c.origen || "—") + '</div></div>' +
        '<div class="field"><label>Último contacto</label><div class="val">' + esc(fmtDate(c.ultimo_contacto)) + '</div></div>' +
        (c.lead_id
          ? '<div class="field full"><label>Lead origen</label><div class="val">lead_id: <code>' + esc(c.lead_id) + '</code> · <a href="dashboard.html">Ver en Dashboard →</a></div></div>'
          : '') +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-primary" id="b-edit" type="button">Editar</button>' +
        '<button class="btn btn-ok" id="b-touch" type="button">Registrar contacto</button>' +
        (c.email ? '<a class="btn btn-soft" href="mailto:' + esc(c.email) + '">Email</a>' : '') +
        (wa ? '<a class="btn btn-ok" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
        '<button class="btn btn-danger" id="b-del" type="button">Eliminar</button>' +
      '</div>';

    document.getElementById("b-edit").onclick = function () { showForm(c); };
    document.getElementById("b-touch").onclick = async function () {
      await sb.from("clientes").update({
        ultimo_contacto: new Date().toISOString(),
        updated_at: new Date().toISOString()
      }).eq("id", c.id);
      if (window.AltivoxN8n) window.AltivoxN8n.clienteEvent("cliente.touched", c);
      await load();
      selected = c.id;
      render();
    };
    document.getElementById("b-del").onclick = async function () {
      if (!confirm("¿Eliminar cliente?")) return;
      await sb.from("clientes").delete().eq("id", c.id);
      if (window.AltivoxN8n) window.AltivoxN8n.clienteEvent("cliente.deleted", { id: c.id, nombre: c.nombre, email: c.email });
      selected = null;
      await load();
    };
  }

  function showForm(c) {
    editing = c ? "edit" : "new";
    document.getElementById("detail-title").textContent = c ? "Editar cliente" : "Nuevo cliente";
    document.getElementById("detail").innerHTML =
      '<div class="form-grid">' +
        '<div class="field"><label>Nombre *</label><input id="i-nombre" value="' + esc(c && c.nombre || "") + '"></div>' +
        '<div class="field"><label>Empresa</label><input id="i-empresa" value="' + esc(c && c.empresa || "") + '"></div>' +
        '<div class="field"><label>Email</label><input id="i-email" type="email" value="' + esc(c && c.email || "") + '"></div>' +
        '<div class="field"><label>Teléfono</label><input id="i-tel" value="' + esc(c && c.telefono || "") + '"></div>' +
        '<div class="field"><label>Estado</label><select id="i-estado"><option>activo</option><option>pausado</option><option>churn</option><option>prospecto</option></select></div>' +
        '<div class="field"><label>Plan</label><select id="i-plan"><option>starter</option><option>growth</option><option>pro</option><option>vip</option></select></div>' +
        '<div class="field"><label>Sector</label><input id="i-sector" value="' + esc(c && c.sector || "") + '"></div>' +
        '<div class="field"><label>MRR €</label><input id="i-mrr" type="number" value="' + esc(c && c.valor_mensual || 0) + '"></div>' +
        '<div class="field full"><label>Notas</label><textarea id="i-notas" rows="4">' + esc(c && c.notas || "") + '</textarea></div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-primary" id="b-save" type="button">Guardar</button>' +
        '<button class="btn btn-ghost" id="b-cancel" type="button">Cancelar</button>' +
      '</div>';

    if (c) {
      document.getElementById("i-estado").value = c.estado || "activo";
      document.getElementById("i-plan").value = c.plan || "starter";
    }

    document.getElementById("b-cancel").onclick = function () {
      editing = null;
      if (c) { selected = c.id; showDetail(); }
      else { document.getElementById("detail").innerHTML = '<div class="empty">Cancelado.</div>'; }
    };

    document.getElementById("b-save").onclick = async function () {
      if (!tableOk) return alert("Primero crea la tabla clientes en Supabase");
      var payload = {
        nombre: document.getElementById("i-nombre").value.trim(),
        empresa: document.getElementById("i-empresa").value.trim(),
        email: document.getElementById("i-email").value.trim(),
        telefono: document.getElementById("i-tel").value.trim(),
        estado: document.getElementById("i-estado").value,
        plan: document.getElementById("i-plan").value,
        sector: document.getElementById("i-sector").value.trim(),
        valor_mensual: Number(document.getElementById("i-mrr").value || 0),
        notas: document.getElementById("i-notas").value.trim(),
        updated_at: new Date().toISOString()
      };
      if (!payload.nombre) return alert("Nombre obligatorio");
      var res;
      if (c) {
        res = await sb.from("clientes").update(payload).eq("id", c.id).select().single();
        selected = c.id;
      } else {
        payload.origen = "manual";
        payload.created_at = new Date().toISOString();
        res = await sb.from("clientes").insert([payload]).select().single();
        if (res.data) selected = res.data.id;
      }
      if (res.error) return alert(res.error.message);
      if (window.AltivoxN8n && res.data) {
        window.AltivoxN8n.clienteEvent(c ? "cliente.updated" : "cliente.created", res.data);
      }
      editing = null;
      await load();
    };
  }

  function exportFiltered() {
    var rows = filtered();
    if (!rows.length) {
      setStatus("No hay clientes para exportar", true);
      return;
    }
    downloadCsv(
      "altivox-clientes-" + new Date().toISOString().slice(0, 10) + ".csv",
      rows.map(function (c) {
        return {
          id: c.id,
          nombre: c.nombre || "",
          empresa: c.empresa || "",
          email: c.email || "",
          telefono: c.telefono || "",
          estado: c.estado || "",
          plan: c.plan || "",
          sector: c.sector || "",
          valor_mensual: c.valor_mensual || 0,
          origen: c.origen || "",
          lead_id: c.lead_id || "",
          notas: c.notas || "",
          created_at: c.created_at || "",
          updated_at: c.updated_at || "",
          ultimo_contacto: c.ultimo_contacto || ""
        };
      }),
      ["id","nombre","empresa","email","telefono","estado","plan","sector","valor_mensual","origen","lead_id","notas","created_at","updated_at","ultimo_contacto"]
    );
    setStatus("CSV exportado · " + rows.length + " clientes");
  }

  document.getElementById("btn-new").onclick = function () { selected = null; showForm(null); };
  document.getElementById("btn-refresh").onclick = load;
  document.getElementById("btn-export").onclick = exportFiltered;
  document.getElementById("btn-logout").onclick = function () { AltivoxAdmin.logout(sb); };
  document.getElementById("search").oninput = render;
  document.getElementById("f-estado").onchange = render;
  document.getElementById("f-plan").onchange = render;
  document.getElementById("sort").onchange = render;

  Array.prototype.forEach.call(document.querySelectorAll(".kpi"), function (k) {
    k.onclick = function () {
      quick = k.getAttribute("data-f") || "all";
      Array.prototype.forEach.call(document.querySelectorAll(".kpi"), function (x) {
        x.classList.toggle("active", x === k);
      });
      render();
    };
  });

  (async function () {
    if (!(await AltivoxAdmin.requireAuth(sb, document.getElementById("admin-email")))) return;
    await load();
  })();
})();
</script>
</body>
</html>
