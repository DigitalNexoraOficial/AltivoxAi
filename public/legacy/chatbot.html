<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGACY · Chatbot | AltivoxAI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/css/admin.css">
<style>
  .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .kpis .kpi { cursor: default; }
  .chat-row {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }
  .chat-row:hover { background: rgba(34, 211, 238, 0.07); }
  .agent-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  #status { font-size: 12px; color: #93c5fd; margin-bottom: 4px; }
  @media (max-width: 1000px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body class="admin-body">
  <div class="admin-grain" aria-hidden="true"></div>
  <aside class="sidebar" id="admin-sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Operaciones Chatbot</h1>
        <p class="sub">Monitor de conversaciones web, agentes y salud del endpoint /api/chat.</p>
      </div>
      <div class="top-actions">
        <div class="pill"><span class="dot"></span><span id="admin-email">Admin</span></div>
        <button class="btn btn-primary" id="btn-ping" type="button">Probar API</button>
        <button class="btn btn-ghost" id="btn-refresh" type="button">Actualizar</button>
        <button class="btn btn-danger" id="btn-logout" type="button">Salir</button>
      </div>
    </header>

    <section class="kpis">
      <div class="kpi chat"><div class="label">Leads chat</div><div class="value" id="k-chat">0</div></div>
      <div class="kpi hot"><div class="label">Calientes chat</div><div class="value" id="k-hot">0</div></div>
      <div class="kpi pending"><div class="label">Sin email real</div><div class="value" id="k-pend">0</div></div>
      <div class="kpi new"><div class="label">Hoy</div><div class="value" id="k-today">0</div></div>
      <div class="kpi"><div class="label">API</div><div class="value" id="k-api" style="font-size:16px">—</div></div>
    </section>
    <p id="status">Cargando...</p>

    <section class="layout" style="margin-top:12px">
      <div class="panel">
        <div class="panel-head"><h2>Conversaciones recientes</h2><span id="count">0</span></div>
        <div class="list" id="list"><div class="empty">Cargando...</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Detalle / Test</h2><span id="detail-title">—</span></div>
        <div class="detail" id="detail">
          <div class="detail-grid" style="margin-bottom:12px">
            <div class="field"><label>Canal</label><div class="val">Web widget (index)</div></div>
            <div class="field"><label>Endpoint</label><div class="val">/api/chat</div></div>
            <div class="field full"><label>Agentes activos</label><div id="agents"></div></div>
            <div class="field full"><label>Test rápido API</label>
              <input id="test-msg" value="Hola, necesito automatizar mi negocio" style="width:100%;margin-top:4px;border-radius:999px">
              <div style="margin-top:8px"><button class="btn btn-ok" id="btn-send-test" type="button">Enviar test</button></div>
              <pre class="transcript" id="test-out" style="margin-top:8px">Esperando prueba...</pre>
            </div>
          </div>
          <div id="lead-box"></div>
        </div>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/admin-core.js"></script>
<script src="/assets/js/n8n-bridge.js"></script>
<script>
(function () {
  var esc = AltivoxAdmin.esc;
  var hasRealEmail = AltivoxAdmin.hasRealEmail;
  var fmtDate = AltivoxAdmin.fmtDate;
  var sb = AltivoxAdmin.createClient();
  AltivoxAdmin.renderShell("chatbot");

  var leads = [];
  var selected = null;
  var AGENTS = [
    ["Asistente General", "altivox-tech"],
    ["Investigador", "altivox-research"],
    ["Diseñador", "altivox-image"],
    ["Auditoría", "altivox-auditor"],
    ["Creativo", "altivox-creative"],
    ["Sistemas", "altivox-tech"]
  ];

  function isChat(l) {
    return String(l.fuente || l.tipo_interes || "").toLowerCase().indexOf("chat") >= 0;
  }
  function today(iso) {
    if (!iso) return false;
    var d = new Date(iso), n = new Date();
    return d.toDateString() === n.toDateString();
  }

  async function load() {
    var r = await sb.from("leads").select("*").order("created_at", { ascending: false }).limit(200);
    if (r.error) {
      document.getElementById("status").textContent = r.error.message;
      return;
    }
    leads = (r.data || []).filter(isChat);
    document.getElementById("k-chat").textContent = leads.length;
    document.getElementById("k-hot").textContent = leads.filter(function (l) { return (l.clasificacion || "") === "caliente"; }).length;
    document.getElementById("k-pend").textContent = leads.filter(function (l) { return !hasRealEmail(l.email); }).length;
    document.getElementById("k-today").textContent = leads.filter(function (l) { return today(l.created_at); }).length;
    document.getElementById("count").textContent = leads.length + " chats";
    document.getElementById("status").textContent = "Monitor chatbot listo";
    document.getElementById("agents").innerHTML = AGENTS.map(function (a) {
      return '<div class="agent-line"><span>' + esc(a[0]) + '</span><span class="badge chat">' + esc(a[1]) + '</span></div>';
    }).join("");
    renderList();
  }

  function renderList() {
    var box = document.getElementById("list");
    if (!leads.length) {
      box.innerHTML = '<div class="empty">Aún no hay leads de chat.</div>';
      return;
    }
    box.innerHTML = leads.map(function (l) {
      return (
        '<div class="chat-row" data-id="' + esc(l.id) + '">' +
          '<strong>' + esc(l.nombre || "Lead Chat") + '</strong>' +
          '<span class="badge ' + esc((l.clasificacion || "").toLowerCase()) + '">' + esc(l.clasificacion || "—") + '</span>' +
          '<div class="meta">' + esc(l.email || "") + " · " + esc(fmtDate(l.created_at)) + '</div>' +
          '<div class="preview">' + esc((l.mensaje || "").slice(0, 180)) + '</div>' +
        '</div>'
      );
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".chat-row"), function (el) {
      el.onclick = function () {
        selected = leads.find(function (x) { return String(x.id) === el.getAttribute("data-id"); });
        document.getElementById("detail-title").textContent = selected.nombre || "Chat";
        document.getElementById("lead-box").innerHTML =
          '<div class="field full"><label>Transcripción</label><div class="transcript">' + esc(selected.mensaje || "—") + '</div></div>' +
          '<div class="field full" style="margin-top:10px"><label>Acciones</label>' +
            '<div class="actions" style="margin-top:6px">' +
              '<a class="btn btn-primary" href="dashboard.html">Abrir en Dashboard</a>' +
              (hasRealEmail(selected.email) ? '<a class="btn btn-ok" href="mailto:' + esc(selected.email) + '">Email</a>' : '') +
            '</div>' +
          '</div>';
      };
    });
  }

  async function ping(msg) {
    document.getElementById("k-api").textContent = "...";
    document.getElementById("test-out").textContent = "Llamando /api/chat...";
    try {
      var res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg || "ping", agent: "Asistente General", model: "altivox-tech" })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      document.getElementById("k-api").textContent = "OK";
      document.getElementById("test-out").textContent = data.reply || JSON.stringify(data);
      return true;
    } catch (e) {
      document.getElementById("k-api").textContent = "FAIL";
      document.getElementById("test-out").textContent = String(e.message || e);
      return false;
    }
  }

  document.getElementById("btn-ping").onclick = function () { ping("Hola, test de salud AltivoxAi"); };
  document.getElementById("btn-send-test").onclick = function () { ping(document.getElementById("test-msg").value); };
  document.getElementById("btn-refresh").onclick = load;
  document.getElementById("btn-logout").onclick = function () { AltivoxAdmin.logout(sb); };

  (async function () {
    if (!(await AltivoxAdmin.requireAuth(sb, document.getElementById("admin-email")))) return;
    await load();
    await ping("ping salud");
  })();
})();
</script>
</body>
</html>
