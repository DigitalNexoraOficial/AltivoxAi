<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AltivoxAI | Login</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="assets/css/admin.css">
<style>
  .login-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: #f4f7fb;
  }
  .login-mark img {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: 1px solid rgba(34, 211, 238, 0.4);
  }
  .login-mark span { color: var(--cyan); }
  .login-status.err { color: #fda4af !important; }
  .login-status.ok { color: var(--ok) !important; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">
      <img src="/favicon.png" alt="AltivoxAi" width="36" height="36">
      ALTIVOX<span>AI</span>
    </div>
    <h1>Acceso al panel</h1>
    <p>Ops Panel · solo usuarios autorizados. Sin registro público.</p>

    <input id="login-email" type="email" placeholder="Correo electrónico" autocomplete="username">
    <input id="login-password" type="password" placeholder="Contraseña" autocomplete="current-password">

    <button class="btn btn-primary" id="login-btn" type="button">Iniciar sesión</button>

    <div id="login-status" class="login-status ok">Sistema preparado</div>
    <div class="login-foot">No hay registro público. Acceso solo con cuenta creada en Supabase Auth.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/admin-core.js"></script>
<script src="assets/js/n8n-bridge.js"></script>
<script>
(function () {
  var statusEl = document.getElementById("login-status");
  var emailEl = document.getElementById("login-email");
  var passEl = document.getElementById("login-password");
  var btnEl = document.getElementById("login-btn");

  function setStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.className = "login-status " + (ok ? "ok" : "err");
  }

  var sb;
  try {
    sb = AltivoxAdmin.createClient();
  } catch (e) {
    setStatus("Error cargando Supabase CDN", false);
    return;
  }

  async function doLogin() {
    try {
      var email = (emailEl.value || "").trim().toLowerCase();
      var password = passEl.value || "";
      if (!email || !password) {
        setStatus("Completa email y contraseña", false);
        return;
      }
      btnEl.disabled = true;
      setStatus("Verificando credenciales...", true);
      var result = await sb.auth.signInWithPassword({ email: email, password: password });
      if (result.error || !result.data || !result.data.session) {
        setStatus("Acceso denegado. Credenciales no válidas o usuario no autorizado.", false);
        return;
      }
      var sync = await fetch("/api/ops/session", {
        method: "POST",
        headers: { Authorization: "Bearer " + result.data.session.access_token },
      });
      var syncBody = await sync.json().catch(function () { return {}; });
      if (!sync.ok) {
        await sb.auth.signOut().catch(function () {});
        if (sync.status === 403) {
          setStatus(
            (syncBody && syncBody.message) ||
              "Cuenta sin rol staff. Pide a un SuperAdmin que asigne app_metadata.role.",
            false
          );
        } else {
          setStatus("No se pudo crear la sesión de Ops.", false);
        }
        return;
      }
      setStatus("Acceso correcto", true);
      var params = new URLSearchParams(window.location.search);
      var next = params.get("next") || "dashboard.html";
      if (next.indexOf("/") !== 0 && next.indexOf("http") !== 0) {
        window.location.href = next;
      } else if (next.indexOf("/") === 0 && next.indexOf("//") !== 0) {
        window.location.href = next;
      } else {
        window.location.href = "dashboard.html";
      }
    } catch (err) {
      console.error(err);
      setStatus("Acceso denegado. Credenciales no válidas o usuario no autorizado.", false);
    } finally {
      btnEl.disabled = false;
    }
  }

  btnEl.addEventListener("click", doLogin);
  passEl.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  emailEl.addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });

  sb.auth.getSession().then(async function (res) {
    if (res && res.data && res.data.session) {
      var sync = await fetch("/api/ops/session", {
        method: "POST",
        headers: { Authorization: "Bearer " + res.data.session.access_token },
      });
      if (sync.ok) {
        window.location.href = "dashboard.html";
      }
    }
  }).catch(function () {});

  (function showQueryError() {
    var params = new URLSearchParams(window.location.search);
    var err = params.get("error");
    if (err === "forbidden") {
      setStatus("Acceso denegado: tu usuario no tiene rol staff (app_metadata.role).", false);
    } else if (err === "auth_required") {
      setStatus("Debes iniciar sesión para acceder al panel.", false);
    }
  })();
})();
</script>
</body>
</html>
